# nginx 站点：sudo cp deploy/nginx-review.conf /etc/nginx/sites-available/review.sligenai.cn
#            sudo ln -s ../sites-available/review.sligenai.cn /etc/nginx/sites-enabled/
# 证书：先用 certbot 申请（sudo certbot certonly --nginx -d review.sligenai.cn），再 sudo nginx -t && sudo systemctl reload nginx
# Basic Auth 密码和 API Token 每个请求都带着，只走 HTTPS。

server {
    listen 80;
    listen [::]:80;
    server_name review.sligenai.cn;

    location /.well-known/acme-challenge/ { root /var/www/html; }   # certbot 续期
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name review.sligenai.cn;

    ssl_certificate     /etc/letsencrypt/live/review.sligenai.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/review.sligenai.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 220m;      # 成片上传上限 150MB；JSON 接口 base64 后约 200MB，再加外壳

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header x-middleware-subrequest "";   # CVE-2025-29927 纵深防御：外部请求不能带这个头
        proxy_read_timeout 330s;    # 同步等待（wait）最长 300 秒
        proxy_request_buffering off;
    }
}
