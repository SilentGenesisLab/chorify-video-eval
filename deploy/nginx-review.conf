# nginx 站点：sudo cp deploy/nginx-review.conf /etc/nginx/sites-available/review.sligenai.cn
#            sudo ln -s ../sites-available/review.sligenai.cn /etc/nginx/sites-enabled/
#            sudo nginx -t && sudo systemctl reload nginx && sudo certbot --nginx -d review.sligenai.cn
server {
    listen 80;
    listen [::]:80;
    server_name review.sligenai.cn;

    client_max_body_size 160m;      # 成片上传上限 150MB

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 330s;    # 同步等待（wait）最长 300 秒
        proxy_request_buffering off;
    }
}
